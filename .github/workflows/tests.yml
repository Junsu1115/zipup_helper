# 푸시할 때마다 macOS와 Windows에서 테스트를 실행한다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Windows 기본 인코딩에서도 한글 테스트 파일을 쓸 수 있게 한다.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -X faulthandler -m pytest -q --basetemp=.pytest_tmp -o faulthandler_timeout=120
