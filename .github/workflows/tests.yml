# 푸시할 때마다 macOS와 Windows에서 테스트를 실행한다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Windows 기본 인코딩에서도 한글 테스트 파일을 쓸 수 있게 한다.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - shell: bash
        run: |
          set -o pipefail
          python -u -X faulthandler -m pytest -v --tb=short --basetemp=.pytest_tmp -o faulthandler_timeout=120 2>&1 | tee pytest_output.txt
      # 실패 내용을 주석으로 남긴다. 주석은 로그인 없이 읽을 수 있다.
      - if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          text = Path("pytest_output.txt").read_text(encoding="utf-8", errors="replace")
          marker = "short test summary info"
          summary = text[text.rfind(marker):] if marker in text else ""
          # 프로세스가 죽으면 마지막 줄에 그때 돌던 테스트가 남으므로 뒤쪽을 남긴다.
          tail_size = max(35000 - len(summary) - 1, 0)
          body = (summary + "\n" + text[-tail_size:])[:35000]
          for start in range(0, len(body), 3500):
              chunk = body[start:start + 3500]
              chunk = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{chunk}")
          EOF

  # 설치 파일을 실제로 실행해서 helper 명령과 바로가기가 만들어지는지 확인한다.
  install-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: call install_windows.bat nopause > install_output.txt 2>&1
        shell: cmd
      - run: |
          if (-not (Test-Path "$env:LOCALAPPDATA\zipup_helper\helper.cmd")) { exit 1 }
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path (Join-Path $desktop 'zipup_helper.lnk'))) { exit 1 }
        shell: pwsh
      # 실패 내용을 주석으로 남긴다. 주석은 로그인 없이 읽을 수 있다.
      - if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          text = Path("install_output.txt").read_text(encoding="utf-8", errors="replace")
          marker = "short test summary info"
          summary = text[text.rfind(marker):] if marker in text else ""
          body = (summary + "\n" + text)[:35000]
          for start in range(0, len(body), 3500):
              chunk = body[start:start + 3500]
              chunk = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{chunk}")
          EOF

  install-mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./install_mac.command < /dev/null
      - run: test -x "$HOME/.local/bin/helper" && test -d "$HOME/Desktop/zipup_helper.app"
